version: 1
source: local # local | wordpress (overridden by ARGON_SOURCE env)

site:
  title: Argon
  description: A clean static blog powered by Argon.
  url: https://example.com
  language: zh-CN
  timezone: Asia/Shanghai
  keywords: Argon, Blog
  dateFormat: YMD # YMD | MDY | DMY

appearance:
  color: "#5e72e4"
  allowColorPicker: true
  cardRadius: 10
  cardShadow: big # small | big
  font: sans # sans | serif
  layout: double # single | double | double-reverse | triple
  immersionColor: true
  amoledDark: false
  darkmode: system # off | system | time | always
  articleHeaderStyle: article-header-style-2 # article-header-style-default | article-header-style-1 | article-header-style-2
  mobileScale: true
  disableGoogleFont: true
  customHeadHtml: ""
  customFootHtml: ""

banner:
  size: full # full | mini | fullscreen | hide
  title: ""
  subtitle: ""
  typing: false
  typingInterval: 100
  backgroundUrl: ""
  hideShapes: false
  colorType: shape-primary
  toolbarMask: false

background:
  url: ""
  darkUrl: ""
  opacity: 1
  bannerStyle: normal # normal | transparent

toolbar:
  title: ""
  icon: /argon/toolbar-icon.svg
  iconLink: /
  blur: true
  headroom: "false" # "false" | "true" | "absolute"
  menu:
    - label: 首页
      href: /
    - label: 说说
      href: /shuoshuo/
    - label: 归档
      href: /archives/
    - label: 友链
      href: /links/

sidebar:
  announcement: ""
  bannerTitle: ""
  bannerSubtitle: ""
  authorName: Argon
  authorDescription: ""
  authorImage: ""
  menu:
    - label: 首页
      href: /
      icon: fa-home
    - label: 说说
      href: /shuoshuo/
      icon: fa-comments-o
    - label: 归档
      href: /archives/
      icon: fa-archive
    - label: 关于
      href: /about/
      icon: fa-user-o
  authorLinks:
    - label: GitHub
      href: https://github.com/solstice23/argon-theme
  widgets:
    - type: links
      title: 导航
      items:
        - label: 归档
          href: /archives/
        - label: 说说
          href: /shuoshuo/

article:
  listLayout: "1" # "1" | "2" | "3"
  waterflow: "1" # "1" | "2" | "3" | "2and3"
  meta: [time, views, comments, categories]
  hideCategories: false
  showReadingTime: true
  readingSpeed: 300
  readingSpeedEn: 160
  readingSpeedCode: 80
  trimWords: 175
  hideShortcodeInPreview: true
  intoArticleAnimation: true
  thumbnailInBanner: false
  firstImageAsThumbnail: true
  showShare: true
  related: tag # disabled | category | tag | category,tag
  relatedLimit: 6
  relatedOrderBy: date # date | title
  relatedOrder: desc # desc | asc
  outdatedDays: 0
  outdatedTip: 本文最后更新于 %date_delta% 天前，其中的信息可能已经有所发展或是发生改变。
  outdatedTipType: warning # warning | info
  outdatedTimeType: absolute # absolute | relative
  archivesUrl: /archives/
  donateQr: ""
  afterPostHtml: ""
  showCatalogNumbers: true
  timelineShowMonth: true
  enableSearchFilters: true
  searchFilters: [post, page, shuoshuo]
  referenceTitle: 参考

footer:
  html: ""
  hideAuthor: false

motion:
  lazyload: true
  lazyloadThreshold: 800
  lazyloadEffect: fadeIn # fadeIn | slideDown | none
  lazyloadLoadingStyle: "1" # "1".."11" | "none"
  zoomify: false
  zoomifyDuration: 200
  zoomifyEasing: cubic-bezier(0.4,0,0,1)
  zoomifyScale: 0.9
  readingProgress: true
  fancybox: true
  smoothScroll: "1" # "1" | "1_pulse" | "2" | "3" | "disabled"
  pangu: ""
  foldLongComments: false
  foldLongShuoshuo: false
  pjax: true
  pjaxAnimation: true
  codeHighlight: true
  codeTheme: vs2015
  codeHideLineNumber: false
  codeTransparentLineNumber: false
  codeBreakLine: true
  disableCodeblockStyle: false
  math: none # none | katex | mathjax3 | mathjax2
  katexCdn: ""
  mathjaxCdn: ""
  mathjaxV2Cdn: ""

fab:
  darkmode: false
  comment: true
  settings: true

home:
  showShuoshuo: true
  pageSize: 10

comments:
  provider: wordpress # none | giscus | waline | twikoo | artalk | wordpress
  giscus:
    repo: ""
    repoId: ""
    category: Announcements
    categoryId: ""
    mapping: pathname
    lang: zh-CN
  waline:
    serverURL: ""
    lang: zh-CN
  twikoo:
    envId: ""
    region: ""
  artalk:
    server: ""
    site: ""
  wordpress:
    endpoint: /api/comments
  allowMailNotice: true
  mailNoticeChecked: false
  allowMarkdown: true
  allowPrivateMode: true
  hideAuthorInputs: false
  captcha: true
  captchaAjax: false
  emotionKeyboard: true
  allowEdit: true
  editHistoryVisibility: admin
  enablePinning: true
  enableUpvote: true
  enableQqAvatar: true
  textGravatar: true
  showUa: true
  showParentInfo: true
  paginationType: feed
  avatarVcenter: false
  gravatarCdn: ""

friendLinks: []

agent:
  enabled: true
  robotsTxt: true
  llmsTxt: true
  markdownMirrors: true
  jsonIndex: true
  jsonLd: true
  webMcp: true
  allowTrainingCrawlers: true
  customRobotsTxt: ""
  customLlmsTxt: ""
