# Reference Cloudflare Workers (Static Assets) configuration.
# Active deploy file lives at `theme/wrangler.toml` so `npx wrangler deploy` works directly in `theme/`.
name = "argon-astro"
main = "./platform/cloudflare/worker.mjs"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
